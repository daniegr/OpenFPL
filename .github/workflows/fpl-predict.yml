# Free, scheduled FPL refresh: update data -> retrain -> predict -> optimise.
#
# Every run pulls the latest FPL data into a local SQLite DB, retrains the
# per-position models on it (forward-in-time), and produces blended predictions
# and a transfer plan as downloadable artifacts. Runs on GitHub's free tier; no
# secrets or paid services required. Trigger manually via the Actions tab, or let
# the cron run it. (CI runners are CPU-only; training auto-uses a GPU when one is
# available, e.g. on a self-hosted runner.)
name: FPL refresh

on:
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek to predict (blank = next)"
        required: false
        default: ""
      entry:
        description: "FPL entry (squad) id to optimise"
        required: false
        default: "883566"
      blend:
        description: "Retrained blend: auto, 0, or a weight 0..1"
        required: false
        default: "auto"
  schedule:
    # Twice weekly so the data + models stay current around deadlines.
    - cron: "0 8 * * 4"   # Thu 08:00 UTC — early planning
    - cron: "0 9 * * 6"   # Sat 09:00 UTC — capture late team news

permissions:
  contents: write        # publish the retrained models to a rolling release

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plug.txt -r requirements-pipeline.txt

      # Persist the static historical backfill (HTTP cache) and the SQLite DB
      # between runs: the backfill isn't re-downloaded, and the Understat
      # player pull stays incremental (only players who featured since).
      # Live FPL data is always fetched fresh.
      - name: Restore historical-data cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/fpl.sqlite
          key: fpl-hist-${{ github.run_id }}
          restore-keys: fpl-hist-

      - name: Update data (fresh live + cached history + Understat) into SQLite
        run: python -m fpl_engine pull --cache --understat

      - name: Retrain per-position models (forward-in-time)
        run: python -m fpl_engine train

      - name: Predict (next gameweek, blended)
        run: |
          BLEND="${{ github.event.inputs.blend || 'auto' }}"
          GW_ARG=""
          if [ -n "${{ github.event.inputs.gw }}" ]; then GW_ARG="--gw ${{ github.event.inputs.gw }}"; fi
          python -m fpl_engine predict $GW_ARG --blend "$BLEND" --out data/predictions_next.csv

      - name: Optimise squad / transfers (blended)
        run: |
          ENTRY="${{ github.event.inputs.entry || '883566' }}"
          BLEND="${{ github.event.inputs.blend || 'auto' }}"
          python -m fpl_engine optimise --entry "$ENTRY" --horizon 5 --blend "$BLEND" \
            | tee data/optimise_plan.txt

      # The retrained models are published to a rolling release so local
      # installs can pull them (python -m fpl_engine fetch-models / the web
      # app's Data button) and blend them with OpenFPL.
      - name: Publish retrained models (rolling release models-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd models && zip -qr ../retrained.zip retrained)
          gh release view models-latest >/dev/null 2>&1 ||             gh release create models-latest --title "Latest retrained models"               --notes "Rolling release updated by the FPL refresh workflow."
          gh release upload models-latest retrained.zip data/predictions_next.csv             data/optimise_plan.txt --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: fpl-refresh
          path: |
            data/predictions_next.csv
            data/optimise_plan.txt
            models/retrained/
